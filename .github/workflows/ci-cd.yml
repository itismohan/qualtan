name: QUALTAN CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "GitHub Environment to deploy after all quality gates pass"
        required: true
        default: none
        type: choice
        options:
          - none
          - staging
          - production
      image_tag:
        description: "Optional immutable image tag or digest to apply after manifests are deployed"
        required: false
        type: string

# Every job is read-only with respect to repository contents. Deployment
# credentials come from a protected GitHub Environment rather than a repository token.
permissions:
  contents: read

concurrency:
  group: qualtan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  validate:
    name: Validate framework
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline framework validation
        run: python scripts/validate_framework.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package.json

      # The repository does not currently include a lockfile. npm install is used
      # until package-lock.json is intentionally committed; then switch to npm ci.
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Run committed Playwright tests when present
        if: ${{ hashFiles('**/*.spec.ts', '**/*.spec.js') != '' }}
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Run Locust smoke test against isolated local mock API
        if: ${{ hashFiles('performance/locustfile.py') != '' }}
        run: python scripts/run_performance_smoke.py

      - name: Enforce Python dependency security audit
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Check Node dependency advisories
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload validation and test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualtan-validation-${{ github.run_id }}
          path: |
            artifacts/validation/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Publish immutable framework bundle
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Create source bundle
        run: |
          git archive --format=tar.gz --prefix=qualtan-${{ github.sha }}/ ${{ github.sha }} > qualtan-${{ github.sha }}.tar.gz
          sha256sum qualtan-${{ github.sha }}.tar.gz | tee qualtan-${{ github.sha }}.sha256

      - name: Upload immutable framework bundle
        uses: actions/upload-artifact@v4
        with:
          name: qualtan-framework-${{ github.sha }}
          path: |
            qualtan-${{ github.sha }}.tar.gz
            qualtan-${{ github.sha }}.sha256
          retention-days: 30

  deploy:
    name: Deploy protected environment
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.deploy_environment }}
    permissions:
      contents: read
    concurrency:
      group: qualtan-deploy-${{ inputs.deploy_environment }}
      cancel-in-progress: false
    env:
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      K8S_KUSTOMIZE_PATH: ${{ vars.K8S_KUSTOMIZE_PATH }}
      K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
      K8S_CONTAINER: ${{ vars.K8S_CONTAINER }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for setting in K8S_NAMESPACE K8S_KUSTOMIZE_PATH K8S_DEPLOYMENT K8S_CONTAINER KUBE_CONFIG_DATA; do
            if [[ -z "${!setting:-}" ]]; then
              echo "::error::Required GitHub Environment variable or secret '$setting' is not configured."
              exit 1
            fi
          done
          test -d "$K8S_KUSTOMIZE_PATH"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          echo "$KUBE_CONFIG_DATA" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Apply version-controlled manifests
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" apply -k "$K8S_KUSTOMIZE_PATH"

      - name: Apply requested immutable image reference
        if: ${{ inputs.image_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=${{ inputs.image_tag }}"

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=5m
          kubectl -n "$K8S_NAMESPACE" get deployment "$K8S_DEPLOYMENT" -o wide
